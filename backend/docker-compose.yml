services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mesaflow
      POSTGRES_USER: mesaflow
      POSTGRES_PASSWORD: mesaflow
    ports:
      - "5432:5432"
    volumes:
      - mesaflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesaflow -d mesaflow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mesaflow_pg:
